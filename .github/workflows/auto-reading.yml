name: Auto Reading Bot

on:
  schedule:
    # 每小时触发三次（避开整点，整点最容易被 GitHub 延迟或丢弃）。GitHub 常丢弃定时触发，
    # 多留触发机会；是否阅读、读多久由 plan 任务按当日剩余阅读时长决定，多余的触发约 10 秒结束。
    - cron: '7,27,47 * * * *'

  workflow_dispatch:
    inputs:
      target_duration:
        description: '阅读时长（分钟，格式：30-60）'
        required: false
        default: ''
        type: string
      reading_mode:
        description: '阅读模式'
        required: false
        default: 'smart_random'
        type: choice
        options:
          - smart_random
          - sequential
          - pure_random
      notify_enabled:
        description: '启用通知'
        required: false
        default: true
        type: boolean
      notify_only_on_failure:
        description: '仅失败时发送通知'
        required: false
        default: true
        type: boolean
      history_enabled:
        description: '启用执行历史持久化'
        required: false
        default: true
        type: boolean
      history_max_entries:
        description: '执行历史最多保留多少条'
        required: false
        default: '50'
        type: string

# 同一时间只运行一个，避免两次阅读重叠
concurrency:
  group: auto-reading
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      duration: ${{ steps.decide.outputs.duration }}
      plan_date: ${{ steps.decide.outputs.plan_date }}
    steps:
      - name: Keep schedule enabled
        # GitHub 会停用 60 天无活动仓库的定时任务，定期调用 enable 可避免
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/auto-reading.yml/enable" \
            || echo "::warning::启用定时任务失败，可忽略"

      - name: Decide whether to read
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
          EVENT_NAME: ${{ github.event_name }}
          DAILY_MINUTES: ${{ vars.DAILY_MINUTES || '240-360' }}
          SESSION_MINUTES: ${{ vars.SESSION_MINUTES || '45-150' }}
          MAX_DAILY_RUNS: ${{ vars.MAX_DAILY_RUNS || '8' }}
          READING_WINDOW: ${{ vars.READING_WINDOW || '07:30-23:00' }}
          MIN_GAP_MINUTES: ${{ vars.MIN_GAP_MINUTES || '45' }}
        run: |
          if [ "$HAS_PAT" = "true" ]; then
            export READ_PLAN="$(gh variable get READ_PLAN --repo "$GITHUB_REPOSITORY" 2>/dev/null || true)"
          else
            echo "::warning::未配置 GH_PAT，无法记录每日计划和回写 Cookie，每次触发按固定时长阅读"
          fi
          python3 - <<'EOF'
          import json, math, os, random, statistics
          from datetime import datetime
          from zoneinfo import ZoneInfo

          def span(name):
              low, high = os.environ[name].split("-")
              return int(low), int(high)

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          today = now.date().isoformat()
          min_low, min_high = span("DAILY_MINUTES")
          s_low, s_high = span("SESSION_MINUTES")
          max_runs = int(os.environ["MAX_DAILY_RUNS"])
          gap_min = int(os.environ["MIN_GAP_MINUTES"])
          start_s, end_s = os.environ["READING_WINDOW"].split("-")
          day = now.replace(second=0, microsecond=0)
          win_start = day.replace(hour=int(start_s[:2]), minute=int(start_s[3:]))
          win_end = day.replace(hour=int(end_s[:2]), minute=int(end_s[3:]))
          print(f"北京时间 {now:%Y-%m-%d %H:%M}，窗口 {start_s}-{end_s}，"
                f"每日 {min_low}-{min_high} 分钟，最多 {max_runs} 次")

          try:
              state = json.loads(os.environ.get("READ_PLAN") or "{}")
          except json.JSONDecodeError:
              state = {}
          # 记录最近的触发时间，用来估算 GitHub 实际的触发间隔
          stamp = int(now.timestamp())
          triggers = [t for t in state.get("triggers", []) if stamp - t < 3 * 86400][-11:]
          state["triggers"] = triggers + [stamp]
          # 旧版计划按次数记录（target/done），没有 target_min 时也重新生成
          if state.get("date") != today or "target_min" not in state:
              state.pop("target", None)
              state.pop("done", None)
              state.update(date=today, target_min=random.randint(min_low, min_high),
                           done_min=0, runs=0)
              print(f"新的一天，今日目标 {state['target_min']} 分钟")
          diffs = [b - a for a, b in zip(state["triggers"], state["triggers"][1:])
                   if 0 < b - a < 12 * 3600]
          interval_h = (min(6.0, max(0.25, statistics.median(diffs) / 3600))
                        if len(diffs) >= 3 else 1.0)

          remaining = state["target_min"] - state["done_min"]
          runs_left = max_runs - state["runs"]
          # 每段时长偏好取区间中点；剩余时间只够更少的触发时，拉长每段
          preferred = (s_low + s_high) / 2
          desired = max(1, min(runs_left, math.ceil(remaining / preferred)))
          hours_left = max(0.0, (win_end - now).total_seconds() / 3600)
          cycle_h = max(interval_h, (preferred + gap_min) / 60)
          opportunities = 1 + hours_left / cycle_h
          sessions = max(1, min(desired, math.floor(opportunities)))
          # 开始前等待和休息不计入阅读时长，按约 92% 折算
          duration = remaining / sessions / 0.92 * random.uniform(0.85, 1.15)
          duration = int(min(s_high, max(s_low, duration), max(15, remaining / 0.92)))
          print(f"今日已读 {state['done_min']:.0f}/{state['target_min']} 分钟，"
                f"{state['runs']} 次；触发间隔约 {interval_h:.1f} 小时")

          def finish(run, reason):
              print(f"决定: {'阅读 ' + str(duration) + ' 分钟' if run else '跳过'}，原因: {reason}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"run={'true' if run else 'false'}\n"
                          f"duration={duration}\nplan_date={today}\n")
              with open("new_plan.json", "w") as f:
                  json.dump(state, f, separators=(",", ":"))
              raise SystemExit

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              finish(True, "手动触发")
          if os.environ["HAS_PAT"] != "true":
              duration = int((s_low + s_high) / 2)
              chance = 5 / max(1.0, (win_end - win_start).total_seconds() / 3600)
              finish(win_start <= now <= win_end and random.random() < chance,
                     f"无状态模式，概率 {chance:.2f}")
          if not (win_start <= now <= win_end):
              finish(False, "不在阅读时间窗口内")
          if remaining < 10:
              finish(False, "今日阅读时长已达标")
          if runs_left <= 0:
              finish(False, "今日阅读次数已达上限")
          since_last = now.timestamp() - float(state.get("last_end") or 0)
          if since_last < gap_min * 60:
              finish(False, f"距上次结束仅 {since_last / 60:.0f} 分钟")
          # 触发稀疏时（GitHub 丢弃较多定时触发）每次都读，否则按剩余需求随机
          chance = 1.0 if interval_h >= 1.5 else min(1.0, desired / opportunities * 1.3)
          finish(random.random() < chance,
                 f"还需约 {desired} 段 / 约 {opportunities:.1f} 次机会，概率 {chance:.2f}")
          EOF
          if [ "$HAS_PAT" = "true" ] && [ -f new_plan.json ]; then
            gh variable set READ_PLAN --repo "$GITHUB_REPOSITORY" --body "$(cat new_plan.json)"
          fi

  read:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 单次最长阅读 SESSION_MINUTES 上限（默认 150）+ 开始前等待 + 安装
    timeout-minutes: 200

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve runtime parameters
        env:
          INPUT_TARGET_DURATION: ${{ github.event.inputs.target_duration }}
          PLAN_DURATION: ${{ needs.plan.outputs.duration }}
        run: |
          # 手动触发时填写的时长优先，否则使用 plan 按当日剩余时长计算的值
          target_duration="${INPUT_TARGET_DURATION:-${PLAN_DURATION:-60}}"
          echo "TARGET_DURATION=$target_duration" >> "$GITHUB_ENV"

      - name: Create config file
        run: |
          cat > config.yaml <<EOF
          app:
            name: "WeReadBot-GitHub-Action"
            startup_mode: "immediate"
            startup_delay: "60-600"

          reading:
            mode: "${{ github.event.inputs.reading_mode || 'smart_random' }}"
            target_duration: "${TARGET_DURATION}"
            reading_interval: "25-55"
            use_curl_data_first: true
            fallback_to_config: true
            smart_random:
              book_continuity: 0.8
              chapter_continuity: 0.7
              book_switch_cooldown: 3600

          human_simulation:
            enabled: true
            reading_speed_variation: true
            break_probability: 0.04
            break_duration: "30-300"
            skim_probability: 0.08
            long_read_probability: 0.06
            rotate_user_agent: false

          network:
            timeout: 30
            retry_times: 3
            retry_delay: "5-15"
            rate_limit: 10

          notification:
            enabled: ${{ github.event.inputs.notify_enabled != 'false' }}
            include_statistics: true
            only_on_failure: ${{ github.event.inputs.notify_only_on_failure != 'false' }}
            triggers:
              session_success: ${{ github.event.inputs.notify_only_on_failure == 'false' }}
              multi_user_summary: ${{ github.event.inputs.notify_only_on_failure == 'false' }}
              session_failure: true
              runtime_error: true
              general: true

          logging:
            level: "INFO"
            format: "detailed"
            file: "logs/weread.log"
            max_size: "10MB"
            backup_count: 5
            console: true

          history:
            enabled: ${{ github.event.inputs.history_enabled != 'false' }}
            file: "logs/run-history.json"
            max_entries: ${{ github.event.inputs.history_max_entries || '50' }}
            persist_runtime_error: true
          EOF

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run WeRead Bot
        id: bot
        env:
          # Cookie刷新QL属性，根据不同用户的环境，可能需要设置为True或False来确保cookie刷新正常工作，默认值为false
          HACK_COOKIE_REFRESH_QL: ${{ secrets.HACK_COOKIE_REFRESH_QL }}
          # 多用户 cURL：在 WEREAD_CURL_STRING 中放置多段 curl，段与段之间至少插入两个空行
          WEREAD_CURL_STRING: ${{ secrets.WEREAD_CURL_STRING }}
          # 书籍列表（JSON，结构同 reading.books），扫码生成的 cURL 不含书籍时必须配置
          WEREAD_BOOKS: ${{ vars.WEREAD_BOOKS }}
          # 多用户并发控制，未设置默认 1（顺序执行）
          MAX_CONCURRENT_USERS: ${{ secrets.MAX_CONCURRENT_USERS || 1 }}
          # 单用户连续阅读失败上限，未设置时默认 5
          MAX_CONSECUTIVE_FAILURES: ${{ secrets.MAX_CONSECUTIVE_FAILURES || 5 }}
          # 通知相关环境变量
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
          BARK_SOUND: ${{ secrets.BARK_SOUND }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_MSG_TYPE: ${{ secrets.FEISHU_MSG_TYPE }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_MSG_TYPE: ${{ secrets.DINGTALK_MSG_TYPE }}
          GOTIFY_SERVER: ${{ secrets.GOTIFY_SERVER }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
          GOTIFY_TITLE: ${{ secrets.GOTIFY_TITLE }}
          # 代理设置（可选）
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          SERVERCHAN3_UID: ${{ secrets.SERVERCHAN3_UID }}
          SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}
          SERVERCHAN3_TAGS: ${{ secrets.SERVERCHAN3_TAGS }}
          SERVERCHAN3_SHORT: ${{ secrets.SERVERCHAN3_SHORT }}
          PUSHDEER_PUSHKEY: ${{ secrets.PUSHDEER_PUSHKEY }}
          PUSHDEER_TYPE: ${{ secrets.PUSHDEER_TYPE }}
          NOTIFICATION_ONLY_ON_FAILURE: ${{ secrets.NOTIFICATION_ONLY_ON_FAILURE || github.event.inputs.notify_only_on_failure == 'true' || 'false' }}
          HISTORY_ENABLED: ${{ secrets.HISTORY_ENABLED || github.event.inputs.history_enabled == 'true' || 'true' }}
          HISTORY_FILE: ${{ secrets.HISTORY_FILE || 'logs/run-history.json' }}
          HISTORY_MAX_ENTRIES: ${{ secrets.HISTORY_MAX_ENTRIES || github.event.inputs.history_max_entries || '50' }}
          HISTORY_PERSIST_RUNTIME_ERROR: ${{ secrets.HISTORY_PERSIST_RUNTIME_ERROR || 'true' }}
          # 其他环境变量
          TZ: 'Asia/Shanghai'
        run: |
          echo "开始自动阅读任务..."
          echo "当前时间: $(date)"
          echo "运行参数:"
          echo "- 阅读时长: ${TARGET_DURATION}"
          echo "- 阅读模式: ${{ github.event.inputs.reading_mode || 'smart_random' }}"
          echo "================================"

          # 刷新后的 Cookie 写到 RUNNER_TEMP，不进入 logs/ 和 artifact
          python weread-bot.py --config config.yaml --save-curl "$RUNNER_TEMP/weread-curl.txt"

      - name: Save renewed cookie to secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # 只有 Cookie 刷新成功时 --save-curl 才会生成文件
          if [ ! -f "$RUNNER_TEMP/weread-curl.txt" ]; then
            echo "本次没有可回写的 Cookie"
          elif [ -z "$GH_TOKEN" ]; then
            echo "::warning::未配置 GH_PAT，刷新后的 Cookie 未回写，Secret 中的 Cookie 过几天会失效"
          else
            gh secret set WEREAD_CURL_STRING --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/weread-curl.txt"
            echo "已回写 WEREAD_CURL_STRING"
          fi
          rm -f "$RUNNER_TEMP/weread-curl.txt"

      - name: Update daily plan
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BOT_OUTCOME: ${{ steps.bot.outcome }}
          PLAN_DATE: ${{ needs.plan.outputs.plan_date }}
          PLAN_DURATION: ${{ needs.plan.outputs.duration }}
          HISTORY_FILE: ${{ secrets.HISTORY_FILE || 'logs/run-history.json' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            exit 0
          fi
          export READ_PLAN="$(gh variable get READ_PLAN --repo "$GITHUB_REPOSITORY" 2>/dev/null || true)"
          plan="$(python3 - <<'EOF'
          import json, os, sys, time

          try:
              state = json.loads(os.environ.get("READ_PLAN") or "{}")
          except json.JSONDecodeError:
              state = {}
          # 服务端计入的阅读时长 = 本次成功上报的 rt 之和，取自执行历史最后一条
          try:
              with open(os.environ["HISTORY_FILE"], encoding="utf-8") as f:
                  read_seconds = int(json.load(f)[-1]["total_reported_read_seconds"])
          except (OSError, ValueError, IndexError, KeyError, TypeError):
              # 没有执行历史时按计划时长的 90% 估算
              success = os.environ["BOT_OUTCOME"] == "success"
              read_seconds = int(float(os.environ.get("PLAN_DURATION") or 0) * 60 * 0.9) if success else 0
          print(f"本次计入 {read_seconds / 60:.1f} 分钟", file=sys.stderr)
          # 跨过午夜结束时，计入开始阅读那天的计划
          if state.get("date") == os.environ["PLAN_DATE"]:
              state["done_min"] = round(float(state.get("done_min", 0)) + read_seconds / 60, 1)
              state["runs"] = int(state.get("runs", 0)) + 1
          state["last_end"] = int(time.time())
          print(json.dumps(state, separators=(",", ":")))
          EOF
          )"
          echo "今日计划: $plan"
          gh variable set READ_PLAN --repo "$GITHUB_REPOSITORY" --body "$plan"

      - name: Upload runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weread-runtime-${{ github.run_id }}
          path: |
            logs/weread.log
            logs/run-history.json
          if-no-files-found: warn
          retention-days: 7
